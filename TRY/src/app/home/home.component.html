<mat-toolbar color="primary">

  <span>My Todo List</span>

  <span class="spacer"></span>

  <button
    mat-raised-button
    color="warn"
    (click)="logout()"
  >

    <mat-icon>logout</mat-icon>

    Logout

  </button>

</mat-toolbar>


<div id="home-page">

  <button mat-raised-button color="primary" class="add-btn" (click)="addUser()">
  <mat-icon>add</mat-icon>Add Task</button>


  <form [formGroup]="userForm">
    <div formArrayName="users">
      <mat-card class="user-card" *ngFor="let user of users.controls; let i = index" [formGroupName]="i">

        <!-- Task Name -->

        <mat-form-field
          appearance="outline"
          class="full-width"
        >

          <mat-label>Task Name</mat-label>

          <input
            matInput
            formControlName="name"
            [readonly]="editIndex !== i"
          >

        </mat-form-field>


        <!-- Priority Dropdown -->

        <mat-form-field appearance="outline">

          <mat-label>Priority</mat-label>

          <mat-select
            formControlName="priority"
            [disabled]="editIndex !== i"
          >

            <mat-option value="High">
              High
            </mat-option>

            <mat-option value="Medium">
              Medium
            </mat-option>

            <mat-option value="Low">
              Low
            </mat-option>

          </mat-select>

        </mat-form-field>


        <!-- Age -->

        <mat-form-field appearance="outline">

          <mat-label>Days</mat-label>

          <input
            matInput
            type="number"
            formControlName="age"
            [readonly]="editIndex !== i"
          >

        </mat-form-field>


        <!-- Buttons -->

        <div class="actions">

          <!-- Edit -->

          <button
            mat-mini-fab
            color="accent"
            *ngIf="editIndex !== i"
            (click)="editUser(i)"
          >

            <mat-icon>edit</mat-icon>

          </button>


          <!-- Save -->

          <button
            mat-mini-fab
            color="primary"
            *ngIf="editIndex === i"
            (click)="saveUser()"
          >

            <mat-icon>save</mat-icon>

          </button>


          <!-- Delete -->

          <button
            mat-mini-fab
            color="warn"
            (click)="deleteUser(i)"
          >

            <mat-icon>delete</mat-icon>

          </button>

        </div>

      </mat-card>

    </div>

  </form>

</div>
